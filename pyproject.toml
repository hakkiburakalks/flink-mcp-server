[project]
name = "flink-mcp-server"
dynamic = ["version"]
description = "Platform-independent, read-only MCP server for monitoring Apache Flink clusters via the REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "hakkiburakalks" }]
keywords = ["mcp", "model-context-protocol", "apache-flink", "flink", "monitoring", "observability", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.23.0,<2",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/hakkiburakalks/flink-mcp-server"
Source = "https://github.com/hakkiburakalks/flink-mcp-server"
Issues = "https://github.com/hakkiburakalks/flink-mcp-server/issues"

[project.scripts]
flink-mcp-server = "flink_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/flink_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flink_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs a running Flink cluster (docker compose -f tests/env/docker-compose.yml up -d)",
  "k8s: needs a kind cluster with the Flink operator (bash tests/env/k8s/setup.sh)",
]
