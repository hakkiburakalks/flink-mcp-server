# Point FLINK_CLUSTERS_FILE at a copy of this file.
default: local
# Optional: also discover FlinkDeployments (Flink Kubernetes Operator) as clusters
# named <namespace>/<name>. Uses your kubeconfig; see docs/kubernetes.md.
# kubernetes:
#   namespaces: [flink]
#   access: proxy

# Optional: Prometheus trends in diagnose_job and the prometheus_query tools. See docs/prometheus.md.
# prometheus:
#   url: http://prometheus:9090
#   token_env: PROMETHEUS_TOKEN
#   discovered_selector: {namespace: "{namespace}", deployment: "{name}"}   # Kubernetes clusters

clusters:
  local:
    url: http://localhost:8081
  prod:
    url: https://flink-prod.example.com:8081
    token_env: FLINK_PROD_TOKEN   # read from this env var; avoids secrets in the file
    ca_cert: /etc/ssl/certs/corp-ca.pem
    timeout: 15
  staging:
    url: http://flink-staging:8081
    insecure: false
  # With several clusters, tell Prometheus' series apart per cluster:
  # prod:
  #   url: ...
  #   prometheus: {selector: {cluster: prod}}
