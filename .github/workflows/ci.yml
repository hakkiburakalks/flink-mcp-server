name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      - run: uv run pytest -m "not integration and not k8s"
      - name: Run via uvx
        run: uvx --from . flink-mcp-server --version

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: docker compose -f tests/env/docker-compose.yml up -d
      - name: Wait for Flink REST
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/overview | grep -q '"taskmanagers":1' && exit 0
            sleep 2
          done
          docker compose -f tests/env/docker-compose.yml logs
          exit 1
      - name: Wait for Prometheus and submit a job
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:9090/-/ready && break; sleep 2; done
          docker compose -f tests/env/docker-compose.yml exec -T jobmanager \
            flink run -d /opt/flink/examples/streaming/StateMachineExample.jar
      - run: uv run pytest -m integration
      - if: always()
        run: docker compose -f tests/env/docker-compose.yml down

  kubernetes:
    # kind cluster + Flink Kubernetes Operator: discovery, API-server proxy, diagnose_deployment, RBAC.
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: uv sync --extra dev
      - name: Create cluster, install the operator, deploy test Flink clusters
        run: bash tests/env/k8s/setup.sh "$RUNNER_TEMP/k8s"
      - name: Reach Prometheus in the cluster
        run: |
          KUBECONFIG="$RUNNER_TEMP/k8s/admin.kubeconfig" nohup kubectl -n flink port-forward svc/prometheus 9090:9090 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9090/-/ready && break; sleep 2; done
      - run: FLINK_MCP_K8S_TEST_DIR="$RUNNER_TEMP/k8s" uv run pytest -m k8s -v -s
      - name: Cluster state on failure
        if: failure()
        run: |
          export KUBECONFIG="$RUNNER_TEMP/k8s/admin.kubeconfig"
          kubectl get flinkdeployments,pods -n flink -o wide || true
          kubectl describe flinkdeployments -n flink || true
          kubectl logs -n flink deploy/flink-kubernetes-operator --tail=100 || true

  installers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      FLINK_MCP_SOURCE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh (installs uv first if missing)
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          "$HOME/.local/bin/flink-mcp-server" --version
          sh install.sh --uninstall
      - name: install.ps1 (installs uv first if missing)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1
          & "$env:USERPROFILE\.local\bin\flink-mcp-server.exe" --version
          .\install.ps1 -Uninstall
