name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --python ${{ matrix.python-version }}
      - run: uv run pytest -m "not integration"
      - name: Run via uvx
        run: uvx --from . flink-mcp-server --version

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: docker compose -f tests/docker-compose.yml up -d
      - name: Wait for Flink REST
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/overview | grep -q '"taskmanagers":1' && exit 0
            sleep 2
          done
          docker compose -f tests/docker-compose.yml logs
          exit 1
      - run: uv run pytest -m integration
      - if: always()
        run: docker compose -f tests/docker-compose.yml down
