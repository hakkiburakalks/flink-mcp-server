name: Publish to PyPI

# Runs when a GitHub release is published (tag like v0.1.0). Uses PyPI Trusted Publishing,
# so no API token is stored in this repository.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v5
      - name: Tag must match the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv run --locked python -c "import flink_mcp; print(flink_mcp.__version__)")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Release tag does not match package version v$version" >&2
            exit 1
          fi
      - run: uv build --no-sources
      - run: uvx twine==7.0.0 check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
