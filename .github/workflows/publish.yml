name: Publish to PyPI

# Runs when a GitHub release is published (tag like v0.1.0). Uses PyPI Trusted Publishing,
# so no API token is stored in this repository.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -m "not integration and not k8s"
      - run: uvx bandit==1.9.4 -r src -q
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt
      - run: uvx pip-audit==2.10.1 -r audit-requirements.txt --require-hashes --disable-pip

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Tag must match the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv run --locked python -c "import flink_mcp; print(flink_mcp.__version__)")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Release tag does not match package version v$version" >&2
            exit 1
          fi
      - run: uv build --no-sources
      - run: uvx twine==7.0.0 check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
